version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kontrol_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kontrol_db
    ports:
      - "5432:5432"
    volumes:
      - kontrol_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  kontrol_pgdata: